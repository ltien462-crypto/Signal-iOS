name: Build Signal 2 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Signal iOS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show build environment
        run: |
          echo "macOS:"
          sw_vers
          echo ""
          echo "Xcode:"
          xcodebuild -version

      - name: Prepare Signal dependencies
        run: |
          make dependencies

      - name: Build Signal 2 unsigned
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -workspace Signal.xcworkspace \
            -scheme Signal \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            SIGNAL_BUNDLEID_PREFIX=com.tien462.signal2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Find built Signal app
        shell: bash
        run: |
          APP_PATH="$(find "$PWD/build/Build/Products" -type d -name "Signal.app" | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Không tìm thấy Signal.app"
            find "$PWD/build/Build/Products" -maxdepth 4 -type d -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Signal.app found at:"
          echo "$APP_PATH"

          echo ""
          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" || true

      - name: Create unsigned IPA
        shell: bash
        run: |
          rm -rf Payload
          mkdir -p Payload

          ditto "$APP_PATH" "Payload/Signal.app"

          zip -qry Signal2-unsigned.ipa Payload

          echo "IPA created:"
          ls -lh Signal2-unsigned.ipa

      - name: Upload Signal 2 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Signal2-unsigned
          path: Signal2-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Signal2-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
